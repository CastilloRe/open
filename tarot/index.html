<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星夜塔罗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07060f;
  --ink: #f1e8d4;
  --muted: #9d93b5;
  --gold: #d9b46a;
  --gold2: #f6dc95;
  --gold3: #fff4cf;
  --violet: #b48cff;
  --line: rgba(217, 180, 106, .3);
  --rev: #ff8f8f;
  --cw: 110px;
  --serif: "Noto Serif SC", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", serif;
  --latin: "Cinzel", Georgia, "Times New Roman", serif;
  --foil: linear-gradient(115deg, #fff4cf 0%, #e2b65c 22%, #9c6f26 42%, #f6dc95 58%, #c08f3a 78%, #fff1c1 100%);
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font: 16px/1.75 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(60vw 40vw at 15% 10%, rgba(110, 60, 200, .28), transparent 70%),
    radial-gradient(50vw 40vw at 90% 30%, rgba(30, 110, 170, .18), transparent 70%),
    radial-gradient(70vw 50vw at 50% 110%, rgba(160, 60, 120, .2), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  overflow-x: hidden;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
button, input, textarea { font: inherit; color: inherit; }

/* ---------- 标题 ---------- */
header { position: relative; text-align: center; padding: 64px 16px 22px; overflow: hidden; }
.zodiac {
  position: absolute; left: 50%; top: 50%; width: 380px; height: 380px; margin: -190px 0 0 -190px;
  opacity: .22; animation: spin 240s linear infinite; pointer-events: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
header h1 {
  position: relative; margin: 0; font-family: var(--serif); font-weight: 900; font-size: 48px; letter-spacing: .38em; padding-left: .38em;
  background: var(--foil); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: foil 7s ease-in-out infinite; filter: drop-shadow(0 0 22px rgba(246, 220, 149, .35));
}
@keyframes foil { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
header .en { position: relative; font-family: var(--latin); letter-spacing: .6em; font-size: 12px; color: var(--gold); margin-top: 4px; padding-left: .6em; }
header p { position: relative; margin: 10px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .18em; }
.divider { display: flex; align-items: center; gap: 12px; justify-content: center; color: var(--gold); margin: 14px auto 0; max-width: 280px; font-size: 12px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.divider::after { background: linear-gradient(90deg, var(--gold), transparent); }

main { max-width: 1000px; margin: 0 auto; padding: 8px 16px 56px; }
.view { display: none; }
.view.on { display: block; animation: rise .7s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }

/* ---------- 面板 ---------- */
.panel {
  position: relative; border-radius: 16px; padding: 22px;
  background: linear-gradient(160deg, rgba(40, 30, 80, .55), rgba(12, 9, 28, .78));
  border: 1px solid var(--line);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .4) inset, 0 20px 50px rgba(0, 0, 0, .45);
  backdrop-filter: blur(6px);
}
.panel.ornate::before, .panel.ornate::after {
  content: ''; position: absolute; width: 26px; height: 26px; border: 1.5px solid var(--gold); pointer-events: none;
}
.panel.ornate::before { top: 8px; left: 8px; border-right: none; border-bottom: none; border-top-left-radius: 8px; }
.panel.ornate::after { bottom: 8px; right: 8px; border-left: none; border-top: none; border-bottom-right-radius: 8px; }
h2 { font-family: var(--serif); font-weight: 700; color: var(--gold2); font-size: 20px; margin: 0 0 12px; letter-spacing: .12em; }
label.field { display: block; margin-bottom: 20px; }
label.field span, .choice-names label span { display: block; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
textarea, input[type=text] {
  width: 100%; background: rgba(5, 4, 14, .65); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; outline: none; resize: vertical; transition: border-color .2s, box-shadow .2s;
}
textarea { font-family: var(--serif); font-size: 17px; }
textarea:focus, input[type=text]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(217, 180, 106, .15), 0 0 24px rgba(217, 180, 106, .15); }

.spreads { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 20px; }
.spread {
  position: relative; display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; text-align: left;
  background: rgba(5, 4, 14, .5); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer;
  transition: border-color .25s, background .25s, transform .25s, box-shadow .25s; overflow: hidden;
}
.spread svg { width: 54px; height: 54px; display: block; }
.spread b { display: block; font-family: var(--serif); color: var(--gold2); font-weight: 700; letter-spacing: .06em; }
.spread small { color: var(--muted); font-size: 12.5px; line-height: 1.55; display: block; margin-top: 2px; }
.spread em { position: absolute; top: 10px; right: 12px; font-style: normal; color: var(--gold); font-size: 11px; font-family: var(--latin); letter-spacing: .1em; }
.spread:hover { border-color: var(--gold); transform: translateY(-2px); }
.spread[aria-pressed=true] {
  border-color: var(--gold2); background: linear-gradient(160deg, rgba(217, 180, 106, .18), rgba(5, 4, 14, .5));
  box-shadow: 0 0 0 1px var(--gold2) inset, 0 0 30px rgba(246, 220, 149, .18);
}
.choice-names { display: none; gap: 12px; margin-bottom: 20px; }
.choice-names.on { display: grid; grid-template-columns: 1fr 1fr; }

.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; cursor: pointer; }
.toggle input { accent-color: var(--gold); width: 16px; height: 16px; }
.spacer { flex: 1; }

.btn {
  position: relative; overflow: hidden; border: 1px solid var(--gold2); cursor: pointer;
  background: linear-gradient(180deg, #f7dc9a, #c4943f 55%, #9c6d24); color: #1d1406;
  font-family: var(--serif); font-weight: 900; letter-spacing: .3em; padding: 11px 28px 11px calc(28px + .3em); border-radius: 999px;
  box-shadow: 0 0 0 3px rgba(217, 180, 106, .14), 0 8px 30px rgba(217, 180, 106, .3), 0 1px 0 rgba(255, 255, 255, .5) inset;
  transition: transform .2s, box-shadow .2s;
}
.btn::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .65), transparent); transform: skewX(-20deg);
  animation: sweep 4.5s ease-in-out infinite;
}
@keyframes sweep { 0%, 60% { left: -60%; } 100% { left: 130%; } }
.btn:hover { transform: translateY(-2px); box-shadow: 0 0 0 4px rgba(217, 180, 106, .2), 0 10px 40px rgba(246, 220, 149, .45), 0 1px 0 rgba(255, 255, 255, .5) inset; }
.btn.ghost { background: rgba(5, 4, 14, .5); color: var(--gold2); box-shadow: none; border-color: var(--line); letter-spacing: .12em; padding: 9px 20px 9px calc(20px + .12em); font-weight: 700; }
.btn.ghost::after { display: none; }
.btn.ghost:hover { border-color: var(--gold); background: rgba(217, 180, 106, .1); box-shadow: 0 0 24px rgba(217, 180, 106, .15); }

details.history { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; }
details.history summary { cursor: pointer; color: var(--muted); font-size: 14px; letter-spacing: .1em; }
.hist-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.hist-list button {
  width: 100%; text-align: left; background: rgba(5, 4, 14, .5); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 14px; cursor: pointer; font-size: 14px; transition: border-color .2s;
}
.hist-list button:hover { border-color: var(--gold); }
.hist-list .q { font-family: var(--serif); }
.hist-list .meta { color: var(--muted); font-size: 12px; }
.hist-clear { margin-top: 10px; background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; }

/* ---------- 洗牌 ---------- */
.vortex { position: relative; height: 420px; }
.vortex .circle { position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; margin: -180px 0 0 -180px; animation: spin 6s linear infinite, glow 2.6s ease-in-out; opacity: .8; }
@keyframes glow { 0% { opacity: 0; transform: scale(.6) rotate(0); } 40% { opacity: .9; } }
.vortex .c {
  position: absolute; left: 50%; top: 50%; width: 76px; height: 125px; margin: -62px 0 0 -38px;
  animation: orbit 2.6s cubic-bezier(.65, 0, .35, 1) both; animation-delay: var(--dl);
}
.vortex .c svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 10px rgba(246, 220, 149, .35)); }
@keyframes orbit {
  0% { transform: rotate(0) translateY(0) scale(.9); }
  30% { transform: rotate(var(--a)) translateY(-130px) scale(1); }
  72% { transform: rotate(calc(var(--a) + 300deg)) translateY(-130px) scale(1); }
  100% { transform: rotate(calc(var(--a) + 360deg)) translateY(0) scale(.9); }
}
.center-note { text-align: center; color: var(--gold2); font-family: var(--serif); letter-spacing: .4em; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* ---------- 抽牌 ---------- */
.pick-head { text-align: center; margin-bottom: 6px; }
.pick-head h2 { font-size: 24px; margin-bottom: 4px; }
.pick-head p { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .08em; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 14px 0 6px; }
.slots span { font-size: 12px; padding: 2px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); transition: all .3s; }
.slots span.done { border-color: var(--gold); color: #1d1406; background: linear-gradient(180deg, #f7dc9a, #c4943f); }
.slots span.next { border-color: var(--gold2); color: var(--gold2); box-shadow: 0 0 16px rgba(246, 220, 149, .35); animation: pulse 1.4s ease-in-out infinite; }
.fan { position: relative; margin: 0 auto; }
.fan button {
  position: absolute; padding: 0; border: none; background: none; cursor: pointer; border-radius: 4px;
  transform: rotate(var(--a)); transition: transform .25s cubic-bezier(.2, .8, .2, 1), opacity .35s, filter .25s;
  animation: fanIn .9s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--dl);
}
@keyframes fanIn { from { transform: rotate(0) translateY(40px); opacity: 0; } }
.fan button svg { width: 100%; height: 100%; display: block; filter: drop-shadow(-3px 2px 4px rgba(0, 0, 0, .7)); }
.fan button:hover, .fan button:focus-visible {
  transform: rotate(var(--a)) translateY(-22px); outline: none; filter: drop-shadow(0 0 12px rgba(246, 220, 149, .8)) brightness(1.15);
}
.fan button.taken { transform: rotate(var(--a)) translateY(-120px) scale(.7); opacity: 0; pointer-events: none; }
.pick-foot { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }

/* ---------- 牌阵 ---------- */
.reading-head { text-align: center; margin-bottom: 4px; }
.reading-head .q { font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--ink); text-shadow: 0 0 20px rgba(180, 140, 255, .35); }
.reading-head .s { color: var(--gold); font-size: 12px; letter-spacing: .3em; font-family: var(--latin); }
.stage-wrap { padding: 34px 0 22px; }
.stage { position: relative; margin: 0 auto; }
.slot {
  position: absolute; width: var(--cw); height: calc(var(--cw) * 1.65); pointer-events: none;
  animation: deal .8s cubic-bezier(.2, .8, .2, 1) backwards;
}
@keyframes deal { from { opacity: 0; transform: translateY(-160px) rotate(-14deg) scale(.7); } }
.slot.major::before {
  content: ''; position: absolute; inset: -22%; border-radius: 30%; z-index: -1;
  background: radial-gradient(closest-side, rgba(180, 140, 255, .55), rgba(246, 220, 149, .15) 60%, transparent);
  filter: blur(8px); animation: aura 3.2s ease-in-out infinite;
}
@keyframes aura { 50% { opacity: .45; transform: scale(.94); } }
.rot { position: absolute; inset: 0; perspective: 900px; cursor: pointer; pointer-events: auto; }
.rot.cross { transform: rotate(90deg); }
.tilt { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out; }
.inner { position: absolute; inset: 0; transition: transform 1s cubic-bezier(.3, .7, .2, 1.15); transform-style: preserve-3d; }
.flipped .inner { transform: rotateY(180deg); }
.back, .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: calc(var(--cw) * .06); overflow: hidden; box-shadow: 0 12px 30px rgba(0, 0, 0, .65), 0 0 0 1px rgba(246, 220, 149, .15);
}
.back svg, .face svg { width: 100%; height: 100%; display: block; }
.face { transform: rotateY(180deg); }
.face.rev svg { transform: rotate(180deg); }
.face::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0; transition: opacity .3s;
  background:
    radial-gradient(circle at var(--mx, 50%) var(--my, 30%), rgba(255, 244, 207, .45), transparent 42%),
    linear-gradient(125deg, transparent 25%, rgba(255, 110, 220, .16) 40%, rgba(110, 220, 255, .16) 50%, rgba(255, 230, 140, .2) 60%, transparent 75%);
  background-size: 100% 100%, 260% 260%;
  background-position: 0 0, var(--sx, 50%) var(--sy, 50%);
}
.rot.hover .face::after { opacity: 1; }
.rot.shine .face::after { animation: shine 1.4s ease-out; }
@keyframes shine { 0% { opacity: 1; background-position: 0 0, 0% 0%; } 100% { opacity: 0; background-position: 0 0, 100% 100%; } }
.rot:not(.flipped):hover .back { box-shadow: 0 0 0 2px var(--gold2), 0 0 34px rgba(246, 220, 149, .55); }
.rot:not(.flipped) .back { animation: beckon 2.4s ease-in-out infinite; }
@keyframes beckon { 50% { box-shadow: 0 12px 30px rgba(0, 0, 0, .65), 0 0 18px rgba(246, 220, 149, .28); } }
.rot.flash .face { box-shadow: 0 0 0 2px var(--gold2), 0 0 40px rgba(246, 220, 149, .7); }
.badge {
  position: absolute; top: -11px; left: -11px; z-index: 3; width: 24px; height: 24px; border-radius: 50%;
  background: #0b0918; border: 1px solid var(--gold); color: var(--gold2); font: 700 12px/22px var(--latin); text-align: center;
  box-shadow: 0 0 10px rgba(246, 220, 149, .3);
}
.rot.cross .badge { top: auto; bottom: -11px; }

.burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 6; }
.burst::before, .burst::after {
  content: ''; position: absolute; left: calc(var(--cw) * -.6); top: calc(var(--cw) * -.6); width: calc(var(--cw) * 1.2); height: calc(var(--cw) * 1.2);
  border-radius: 50%; border: 2px solid var(--gold3); box-shadow: 0 0 30px var(--gold2), inset 0 0 30px var(--gold2);
  animation: ring .9s ease-out forwards;
}
.burst::after { animation-delay: .12s; border-width: 1px; opacity: 0; }
@keyframes ring { 0% { transform: scale(.15); opacity: 1; } 100% { transform: scale(2.1); opacity: 0; } }
.burst i {
  position: absolute; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--gold3);
  box-shadow: 0 0 10px 3px var(--gold2); animation: spark 1s cubic-bezier(.1, .8, .3, 1) forwards;
}
@keyframes spark { from { transform: rotate(var(--a)) translateY(0); opacity: 1; } to { transform: rotate(var(--a)) translateY(calc(var(--d) * -1)); opacity: 0; } }
.burst.major::before, .burst.major::after { border-color: #e6d6ff; box-shadow: 0 0 50px var(--violet), inset 0 0 40px var(--violet); }
.burst.major i { background: #f3ebff; box-shadow: 0 0 12px 4px var(--violet); }
.arcana-call {
  position: absolute; left: 50%; bottom: calc(100% + 18px); transform: translateX(-50%); white-space: nowrap; z-index: 7; pointer-events: none;
  font: 700 11px/1 var(--latin); letter-spacing: .4em; color: #efe4ff; text-shadow: 0 0 12px var(--violet), 0 0 2px #fff;
  animation: call 2.2s ease-out forwards;
}
@keyframes call { 0% { opacity: 0; transform: translate(-50%, 10px); } 20%, 70% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -6px); } }

.stage-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }

/* ---------- 解读 ---------- */
.entries { display: grid; gap: 14px; }
.entry { display: grid; grid-template-columns: 84px 1fr; gap: 18px; align-items: start; transition: box-shadow .4s, border-color .4s, opacity .4s; }
.entry.flash { box-shadow: 0 0 0 1px var(--gold2), 0 0 34px rgba(246, 220, 149, .3); }
.entry.major { border-color: rgba(180, 140, 255, .55); background: linear-gradient(160deg, rgba(70, 40, 130, .5), rgba(12, 9, 28, .8)); }
.entry.reveal { animation: rise .7s cubic-bezier(.2, .8, .2, 1); }
.entry .thumb { width: 84px; height: 139px; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 20px rgba(0, 0, 0, .6), 0 0 0 1px rgba(246, 220, 149, .2); }
.entry .thumb svg { width: 100%; height: 100%; display: block; }
.entry .thumb.rev svg { transform: rotate(180deg); }
.entry.pending { opacity: .5; }
.entry h3 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: 20px; color: var(--gold2); letter-spacing: .04em; }
.entry h3 .pos { display: block; color: var(--gold); font: 500 12px/1.6 var(--latin); letter-spacing: .2em; margin-bottom: 2px; }
.entry h3 .pos b { font-family: var(--serif); font-weight: 500; letter-spacing: .1em; }
.tag { display: inline-block; font: 600 11px/1.7 system-ui, sans-serif; padding: 0 9px; border-radius: 999px; margin-left: 8px; vertical-align: 3px; border: 1px solid var(--gold); color: var(--gold2); letter-spacing: .1em; }
.tag.rev { border-color: var(--rev); color: var(--rev); }
.tag.maj { border-color: var(--violet); color: #dccbff; }
.entry .pd { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
.kws { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.kws span { font-size: 12px; background: rgba(217, 180, 106, .12); border: 1px solid rgba(217, 180, 106, .25); color: var(--gold2); border-radius: 6px; padding: 0 8px; }
.entry p { margin: 0; }
.entry .extra { color: var(--muted); font-size: 12px; margin-top: 6px; letter-spacing: .05em; }

.summary { margin-top: 18px; display: none; }
.summary.on { display: block; animation: rise .8s cubic-bezier(.2, .8, .2, 1); }
.summary h2 { text-align: center; font-size: 22px; letter-spacing: .4em; padding-left: .4em; }
.energy { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 6px 0 18px; }
.energy div { text-align: center; }
.energy .lab { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.energy .num { font: 700 24px/1.2 var(--latin); }
.energy .bar { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-top: 4px; }
.energy .bar i { display: block; height: 100%; border-radius: 2px; box-shadow: 0 0 10px currentColor; transform-origin: left; animation: grow 1.2s cubic-bezier(.2, .8, .2, 1) backwards .3s; }
@keyframes grow { from { transform: scaleX(0); } }
.summary ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.summary li { position: relative; padding-left: 22px; }
.summary li::before { content: '✦'; position: absolute; left: 0; color: var(--gold); }
.note { color: var(--muted); font-size: 12px; text-align: center; margin-top: 32px; opacity: .8; }

@media (max-width: 560px) {
  header { padding-top: 44px; }
  header h1 { font-size: 36px; }
  .zodiac { width: 300px; height: 300px; margin: -150px 0 0 -150px; }
  .panel { padding: 18px 16px; }
  .entry { grid-template-columns: 62px 1fr; gap: 12px; }
  .entry .thumb { width: 62px; height: 102px; }
  .entry h3 { font-size: 18px; }
  .choice-names.on { grid-template-columns: 1fr; }
  .vortex { height: 360px; }
  .vortex .circle { width: 300px; height: 300px; margin: -150px 0 0 -150px; }
  .energy { gap: 6px; }
  .energy .num { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="165">
      <stop offset="0" stop-color="#fff4cf"/><stop offset=".3" stop-color="#e2b65c"/><stop offset=".5" stop-color="#a97b2e"/>
      <stop offset=".7" stop-color="#f6dc95"/><stop offset="1" stop-color="#b8862f"/>

}));

// 所有渐变定义在页面顶部那个不可见的 <svg> 里，每张牌只引用 id

const GOLD = 'url(#g-gold)';
const GOLD_I = 'url(#g-gold-i)';
const MAJOR_COLOR = '#b48cff';

const f1 = n => n.toFixed(1);
const polar = (cx, cy, r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];

function rays(cx, cy, n, r1, r2, r3, attrs) {
  let d = '';
  for (let k = 0; k < n; k++) {
    const a = -Math.PI / 2 + k * 2 * Math.PI / n;
    const [x1, y1] = polar(cx, cy, r1, a), [x2, y2] = polar(cx, cy, k % 2 ? r3 : r2, a);
    d += `M${f1(x1)},${f1(y1)}L${f1(x2)},${f1(y2)}`;
  }
  return `<path d="${d}" ${attrs}/>`;
}

function polygon(cx, cy, r, n, rot) {
  const pts = [];
  for (let k = 0; k < n; k++) pts.push(polar(cx, cy, r, rot + k * 2 * Math.PI / n).map(f1).join(','));
  return pts.join(' ');
}

const STAR = polygon(0, 0, 7.4, 10, -Math.PI / 2).split(' ').map((p, k) => {
  if (k % 2 === 0) return p;
  const [x, y] = p.split(',').map(Number);
  return f1(x * 3 / 7.4) + ',' + f1(y * 3 / 7.4);
}).join(' ');

const SPARK = 'M0,-5L1.1,-1.1L5,0L1.1,1.1L0,5L-1.1,1.1L-5,0L-1.1,-1.1z';

function suitIcon(key, cx, cy, s, fill) {
  const g = {
    wands: `<path d="M-1.5,-10.5h3v21h-3z"/><path d="M1.5,-5q5.5,-2 6.5,-6.5q-5.5,0 -6.5,4.5zM-1.5,1.5q-5.5,-2 -6.5,-6.5q5.5,0 6.5,4.5z" opacity=".8"/><circle cy="-11" r="1.6"/>`,
    cups: `<path d="M-7.5,-9.5h15q0,10.5 -7.5,12q-7.5,-1.5 -7.5,-12z"/><path d="M-1.3,2.3h2.6v5h-2.6zM-5.5,7h11v2.6h-11z"/><path d="M-5,-7.5q2,4 5,4" fill="none" stroke="#07060f" stroke-width=".8" opacity=".5"/>`,
    swords: `<path d="M0,-11l2.3,3.2v9.6h-4.6v-9.6z"/><path d="M-7,1.6h14v2.1h-14zM-1.05,3.7h2.1v5h-2.1z"/><circle cy="10" r="1.8"/><path d="M0,-8.5v8" stroke="#07060f" stroke-width=".5" opacity=".45"/>`,
    pentacles: `<circle r="9.2" fill="none" stroke="${fill}" stroke-width="1.7"/><circle r="6.9" fill="none" stroke="${fill}" stroke-width=".5"/><polygon points="${STAR}"/>`,
  }[key];
  return `<g transform="translate(${f1(cx)} ${f1(cy)}) scale(${s})" fill="${fill}">${g}</g>`;
}

function pipPositions(n) {
  const top = 34, span = 92, out = [];
  if (n <= 3) {
    for (let i = 0; i < n; i++) out.push([50, top + (i + 0.5) * span / n]);
    return out;
  }
  const rows = Math.floor(n / 2);
  for (let i = 0; i < rows; i++) {
    const y = top + (i + 0.5) * span / rows;
    out.push([29, y], [71, y]);
  }
  // 七的中间那枚放在第一、二排之间，免得跟第二排挤在一起
  if (n % 2) out.push([50, n === 7 ? top + span / rows : top + span / 2]);
  return out;
}

// 一个小的确定性随机数，让每张大牌的星点位置固定
function prng(seed) {
  let s = seed * 9301 + 49297;
  return () => (s = (s * 9301 + 49297) % 233280) / 233280;
}

function frame(accent) {
  const corner = (x, y, sx, sy) =>

     <path transform="translate(${x + sx * 2.6} ${y + sy * 2.6}) scale(.42)" d="${SPARK}" fill="${GOLD}"/>`;
  return `<rect width="100" height="165" rx="6" fill="url(#g-face)"/>
    <rect x="2.6" y="2.6" width="94.8" height="159.8" rx="4.5" fill="none" stroke="${GOLD}" stroke-width="1.4"/>
    <rect x="6" y="6" width="88" height="153" rx="2" fill="none" stroke="${GOLD}" stroke-width=".45" opacity=".8"/>
    ${corner(6, 6, 1, 1)}${corner(94, 6, -1, 1)}${corner(6, 159, 1, -1)}${corner(94, 159, -1, -1)}
    <path d="M30,24.5H41M59,24.5H70" stroke="${accent}" stroke-width=".7" opacity=".9"/>`;
}

    }
    const sides = [3, 4, 5, 6, 7, 8][card.num % 6];
    art = `<circle cx="50" cy="78" r="44" fill="url(#g-major)"/>
      <circle cx="50" cy="78" r="30" fill="url(#g-halo)"/>
      ${dust}
      ${rays(50, 78, 32, 29, 42, 35, `stroke="${GOLD}" stroke-width=".5" opacity=".8"`)}
      <circle cx="50" cy="78" r="27" fill="#0b0920" stroke="${GOLD}" stroke-width="1.1"/>
      <circle cx="50" cy="78" r="24.5" fill="none" stroke="${GOLD}" stroke-width=".35" stroke-dasharray="1 1.6"/>
      <polygon points="${polygon(50, 78, 23, sides, -Math.PI / 2)}" fill="none" stroke="${MAJOR_COLOR}" stroke-width=".5" opacity=".8"/>
      <polygon points="${polygon(50, 78, 23, sides, -Math.PI / 2 + Math.PI / sides)}" fill="none" stroke="${GOLD}" stroke-width=".35" opacity=".6"/>
      <text x="50" y="79" text-anchor="middle" dominant-baseline="central" font-size="25" fill="${GOLD}"
        font-family="'Segoe UI Symbol','Noto Sans Symbols','Noto Sans Symbols 2','DejaVu Sans',serif">${card.glyph}︎</text>
      <text x="50" y="129" text-anchor="middle" font-size="5" letter-spacing="1" fill="#e9d6a6" font-family="Cinzel,Georgia,serif">${card.en.toUpperCase()}</text>`;
  } else if (card.rank.court) {
    top = card.rank.mark;
    const crown = card.num >= 13
      ? `<path transform="translate(50 37) scale(.95)" d="M-9,4L-9,-4L-4.5,0L0,-7L4.5,0L9,-4L9,4Z" fill="${GOLD}"/><circle cx="50" cy="29.8" r="1.2" fill="${GOLD}"/>`
      : `<path transform="translate(50 36) scale(.8)" d="${SPARK}" fill="${GOLD}"/>`;
    art = `<circle cx="50" cy="84" r="40" fill="url(#g-${card.suit.key})"/>
      ${crown}
      <path d="M27,126V66A23,23 0 0 1 73,66V126Z" fill="#0b0920" fill-opacity=".6" stroke="${GOLD}" stroke-width=".9"/>
      <path d="M30.5,126V66.5A19.5,19.5 0 0 1 69.5,66.5V126" fill="none" stroke="${accent}" stroke-width=".45" opacity=".8"/>
      ${rays(50, 88, 24, 14, 22, 18, `stroke="${GOLD}" stroke-width=".35" opacity=".45"`)}
      ${suitIcon(card.suit.key, 50, 88, 2.1, GOLD_I)}`;
  } else if (card.num === 1) {
    top = 'A';
    art = `<circle cx="50" cy="80" r="44" fill="url(#g-${card.suit.key})"/>
      <circle cx="50" cy="80" r="30" fill="url(#g-halo)"/>
      ${rays(50, 80, 40, 30, 44, 37, `stroke="${GOLD}" stroke-width=".45" opacity=".75"`)}
      <circle cx="50" cy="80" r="28" fill="none" stroke="${GOLD}" stroke-width=".8"/>
      ${suitIcon(card.suit.key, 50, 80, 2.7, GOLD_I)}`;
  } else {
    top = String(card.num);
    const s = card.num <= 3 ? 1.35 : card.num >= 7 ? 0.9 : 1.05;
    art = `<ellipse cx="50" cy="80" rx="40" ry="52" fill="url(#g-${card.suit.key})" opacity=".8"/>` +
      pipPositions(card.num).map(([x, y]) => suitIcon(card.suit.key, x, y, s, GOLD_I)).join('');
  }
  const svg = `<svg viewBox="0 0 100 165" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    ${frame(accent)}
    <text x="50" y="27.5" text-anchor="middle" font-size="9.5" fill="${GOLD}" font-weight="700"
      font-family="Cinzel,Georgia,'Noto Serif SC',serif">${top}</text>
    ${art}
    ${namePlate(card.name)}
  </svg>`;
  faceCache.set(card.id, svg);
  return svg;
}

function layoutIcon(sp) {
  const s = 46 / Math.max(sp.w, sp.h * 1.65);
  const ox = (54 - sp.w * s) / 2, oy = (54 - sp.h * 1.65 * s) / 2;
  return `<svg viewBox="0 0 54 54" aria-hidden="true">${sp.pos.map(p => {
    const x = ox + p.x * s, y = oy + p.y * 1.65 * s, w = s, h = 1.65 * s;
    const t = p.cross ? ` transform="rotate(90 ${f1(x + w / 2)} ${f1(y + h / 2)})"` : '';
    return `<rect x="${f1(x + .4)}" y="${f1(y + .4)}" width="${f1(w - .8)}" height="${f1(h - .8)}" rx=".8" fill="${p.cross ? '#f6dc95' : 'rgba(246,220,149,.18)'}" stroke="#d9b46a" stroke-width=".7"${t}/>`;
  }).join('')}</svg>`;
}

// ---------- 星空与黄道 ----------

const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;

(function sky() {
  const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
  let W, H, stars = [], shoot = null;
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 4200) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.25 + .2,
      p: Math.random() * 6.28, s: .4 + Math.random() * 1.6, v: .02 + Math.random() * .07, gold: Math.random() < .14,
    }));
    if (STILL) draw(0);
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      ctx.globalAlpha = .25 + .75 * (.5 + .5 * Math.sin(s.p + t * .001 * s.s));
      ctx.fillStyle = s.gold ? '#f6dc95' : '#e2e8ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
      if (s.r > 1.2) { ctx.globalAlpha *= .25; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 3, 0, 6.283); ctx.fill(); }
      if (!STILL) { s.y -= s.v; if (s.y < -3) { s.y = H + 3; s.x = Math.random() * W; } }
    }
    ctx.globalAlpha = 1;
    if (STILL) return;
    if (!shoot && Math.random() < .004) {
      shoot = { x: W * (.3 + Math.random() * .7), y: H * Math.random() * .4, vx: -(7 + Math.random() * 5), vy: 3 + Math.random() * 2.5, l: 1 };
    }
    if (shoot) {
      const tx = shoot.x - shoot.vx * 14, ty = shoot.y - shoot.vy * 14;
      const g = ctx.createLinearGradient(shoot.x, shoot.y, tx, ty);
      g.addColorStop(0, `rgba(255,244,207,${shoot.l})`); g.addColorStop(1, 'rgba(255,244,207,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(tx, ty); ctx.stroke();
      shoot.x += shoot.vx; shoot.y += shoot.vy; shoot.l -= .014;
      if (shoot.l <= 0 || shoot.x < -100 || shoot.y > H + 100) shoot = null;
    }
  }
  function loop(t) { if (!document.hidden) draw(t); requestAnimationFrame(loop); }
  addEventListener('resize', resize);
  resize();
  if (!STILL) requestAnimationFrame(loop);
})();

function magicCircle(signs) {
  const glyphs = ['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'];
  let g = '';
  if (signs) {
    glyphs.forEach((z, k) => {
      const [x, y] = polar(0, 0, 80, -Math.PI / 2 + k * Math.PI / 6);
      g += `<text x="${f1(x)}" y="${f1(y)}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#f6dc95"
        font-family="'Segoe UI Symbol','Noto Sans Symbols','DejaVu Sans',serif">${z}︎</text>`;
    });
  }
  return `<circle r="96" fill="none" stroke="#d9b46a" stroke-width=".8"/>
    <circle r="91" fill="none" stroke="#d9b46a" stroke-width=".3" stroke-dasharray="2 3"/>
    ${rays(0, 0, 72, 86, 91, 88.5, 'stroke="#d9b46a" stroke-width=".5"')}
    <circle r="70" fill="none" stroke="#d9b46a" stroke-width=".6"/>

    <polygon points="${polygon(0, 0, 70, 3, Math.PI / 2)}" fill="none" stroke="#b48cff" stroke-width=".5"/>
    <circle r="35" fill="none" stroke="#d9b46a" stroke-width=".5"/>
    ${g}`;
}

// ---------- 解读 ----------

function joinCn(list) {
  return list.length < 2 ? list.join('') : list.slice(0, -1).join('、') + '和' + list[list.length - 1];
}

const rankLabel = rank => rank.mark === 'A' ? '王牌' : '数字' + rank.name;

function cardText(card, rev) {
  if (card.major) return rev ? card.rmsg : card.msg;
  const kws = joinCn(rev ? card.rev : card.up);
  const tail = rev
    ? `逆位时，这股能量受阻、过了头或转向内在：${kws}。`
    : `正位时，它表现为${kws}。`;
  if (card.rank.court) return `${card.rank.line}在${card.suit.name}（${card.suit.theme}）里，${tail}`;
  return `${rankLabel(card.rank)}象征${card.rank.theme}；落在${card.suit.name}（${card.suit.theme}）上，${tail}`;
}

function cardExtra(card) {
  if (card.major) return `大阿卡纳 ${ROMAN[card.num]} · ${card.en} · 对应${card.astro}`;
  return `小阿卡纳 · ${card.suit.name} · ${card.suit.el}元素`;
}

function summarize(reading) {
  const n = reading.length;
  if (n === 1) {
    const { card, rev } = reading[0];
    return [`这张${card.name}${rev ? '（逆位）' : ''}就是今天的答案：${(rev ? card.rev : card.up).slice(0, 3).join('、')}。`];
  }
  const out = [];
  const majors = reading.filter(r => r.card.major).length;
  const revs = reading.filter(r => r.rev).length;
  const courts = reading.filter(r => !r.card.major && r.card.rank.court).length;

  if (majors === 0) out.push('全是小阿卡纳：问题落在日常层面，主动权大多握在你自己手里。');
  else if (majors / n >= 0.5) out.push(`大阿卡纳占了 ${majors} 张：这不只是日常琐事，牵动的是更深的人生课题，顺势而为比硬拗更重要。`);
  else out.push(`大阿卡纳有 ${majors} 张：大方向上有命运的推动，细节仍靠你自己把握。`);

  const counts = SUITS.map(s => reading.filter(r => !r.card.major && r.card.suit === s).length);
  const top = Math.max(...counts);
  if (top >= 2 && counts.filter(c => c === top).length === 1) out.push(SUITS[counts.indexOf(top)].most);
  const missing = SUITS.filter((s, i) => counts[i] === 0);
  if (n >= 5 && missing.length === 1) out.push(`唯独没有${missing[0].name}：${missing[0].theme}这一块，也许是被你忽略的地方。`);

  if (revs === 0) out.push('没有逆位：能量通畅，可以放手去做。');
  else if (revs / n > 0.5) out.push(`逆位有 ${revs} 张，偏多：能量有些堵塞或在向内收，先处理卡住的地方，再谈向前。`);

  if (courts >= 2) out.push(`宫廷牌有 ${courts} 张：别人的态度，或你在其中扮演的角色，是这件事的关键。`);

  const nums = {};
  reading.forEach(r => { if (!r.card.major && !r.card.rank.court) nums[r.card.num] = (nums[r.card.num] || 0) + 1; });
  Object.entries(nums).filter(([, c]) => c >= 2).forEach(([num, c]) => {
    out.push(`出现了 ${c} 张「${RANKS[num - 1].name}」：${rankLabel(RANKS[num - 1])}象征${RANKS[num - 1].theme}，这个主题在这次占卜里被强调了。`);
  });

  const last = reading[n - 1];
  if (state.spread === 'choice') {
    const score = r => (r.rev ? -1 : 1) + (r.card.major ? 0.5 : 0);
    const sa = score(reading[1]) + score(reading[2]), sb = score(reading[3]) + score(reading[4]);
    if (sa !== sb) {
      const better = sa > sb ? state.labels.A : state.labels.B;
      out.push(`两条路相比，「${better}」那一边的牌更顺畅；但最终的选择，仍要回到「现状」那张牌提醒你的东西上。`);
    } else {
      out.push('两条路的牌势不相上下：重要的不是哪条路更好，而是你更愿意承担哪一种过程。');
    }
  } else {
    out.push(`最后一张「${last.card.name}${last.rev ? '（逆位）' : ''}」是走向：${last.rev ? last.card.rev[0] : last.card.up[0]}。`);
  }
  return out;
}

function energyHTML(reading) {
  const n = reading.length;
  const cells = [{ lab: '大阿卡纳', color: MAJOR_COLOR, c: reading.filter(r => r.card.major).length }]
    .concat(SUITS.map(s => ({ lab: `${s.el} · ${s.name}`, color: s.color, c: reading.filter(r => !r.card.major && r.card.suit === s).length })));
  return `<div class="energy">${cells.map(x =>
    `<div><div class="num" style="color:${x.color};text-shadow:0 0 14px ${x.color}">${x.c}</div><div class="lab">${x.lab}</div>
      <div class="bar"><i style="width:${(x.c / n) * 100}%;background:${x.color};color:${x.color}"></i></div></div>`).join('')}</div>`;
}

// ---------- 状态 ----------

const state = { question: '', spread: 'three', labels: { A: '选择 A', B: '选择 B' }, allowRev: true, deck: [], picks: [], reading: [], flipped: new Set() };

function rand() {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] / 4294967296;
}

function shuffled() {
  const d = DECK.map(card => ({ card, rev: state.allowRev && rand() < 0.5 }));
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}

const posName = p => p.n.replace('{A}', state.labels.A).replace('{B}', state.labels.B);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const $ = s => document.querySelector(s);

function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
  window.scrollTo({ top: 0, behavior: STILL ? 'auto' : 'smooth' });
}

// ---------- 首页 ----------

function renderSpreads() {
  $('#spreads').innerHTML = Object.entries(SPREADS).map(([k, s]) =>
    `<button class="spread" data-k="${k}" aria-pressed="${k === state.spread}">${layoutIcon(s)}<span><em>${s.count}</em><b>${s.name}</b><small>${s.desc}</small></span></button>`).join('');
  $('#choice-names').classList.toggle('on', state.spread === 'choice');
}

$('#spreads').addEventListener('click', e => {
  const b = e.target.closest('.spread');
  if (!b) return;
  state.spread = b.dataset.k;
  renderSpreads();
});

$('#go').addEventListener('click', () => {
  state.question = $('#question').value.trim();
  state.allowRev = $('#allow-rev').checked;
  state.labels = {
    A: $('#opt-a').value.trim() || '选择 A',
    B: $('#opt-b').value.trim() || '选择 B',
  };
  state.deck = shuffled();
  state.picks = [];
  runShuffle();
});

function runShuffle() {
  const n = 12;
  $('#vortex').innerHTML = `<svg class="circle" viewBox="-100 -100 200 200" aria-hidden="true">${magicCircle(true)}</svg>` +
    Array.from({ length: n }, (_, i) =>
      `<div class="c" style="--a:${i * 360 / n}deg;--dl:${i * 0.03}s">${BACK_SVG}</div>`).join('');
  show('v-shuffle');
  setTimeout(renderPick, STILL ? 300 : 2900);
}

// ---------- 抽牌：扇形牌堆 ----------

function renderPick() {
  const sp = SPREADS[state.spread];
  $('#pick-title').textContent = `请抽 ${sp.pos.length} 张牌`;
  $('#fan').innerHTML = state.deck.map((_, i) => `<button data-i="${i}" aria-label="第 ${i + 1} 张牌">${BACK_SVG}</button>`).join('');
  renderSlots();
  show('v-pick');
  layoutFan();
}

function layoutFan() {
  const fan = $('#fan');
  const W = fan.parentElement.clientWidth;
  const coarse = matchMedia('(pointer: coarse)').matches;
  const w = W < 600 ? 44 : 58, h = Math.round(w * 1.65);
  const minSliver = coarse ? 16 : 13;
  const total = state.deck.length;
  let rows, N, S, R;
  for (rows = 1; rows <= 6; rows++) {
    N = Math.ceil(total / rows);
    S = rows === 1 ? 150 : 112;
    R = Math.min(900, (W - w - 12) / (2 * Math.sin(S / 2 * Math.PI / 180)));
    if (R * S * Math.PI / 180 / N >= minSliver) break;
  }
  // 一排的高度：顶上留出悬停抬起的空间，加上两端的牌旋转后伸到最低的那一点
  const half = S / 2 * Math.PI / 180;
  const rowH = 30 + h / 2 + R * (1 - Math.cos(half)) + w / 2 * Math.sin(half) + h / 2 * Math.cos(half) + 12;
  fan.style.width = W + 'px';
  fan.style.height = rows * rowH + 10 + 'px';
  fan.querySelectorAll('button').forEach((b, i) => {
    const row = Math.floor(i / N), k = i % N, n = Math.min(N, total - row * N);
    const a = n === 1 ? 0 : -S / 2 + S * k / (n - 1);
    Object.assign(b.style, {
      width: w + 'px', height: h + 'px', left: (W - w) / 2 + 'px', top: row * rowH + 30 + 'px',
      transformOrigin: `50% ${h / 2 + R}px`, zIndex: k,
    });
    b.style.setProperty('--a', a.toFixed(2) + 'deg');
    b.style.setProperty('--dl', (i * 0.008).toFixed(3) + 's');
  });
}

function renderSlots() {
  const sp = SPREADS[state.spread];
  $('#slots').innerHTML = sp.pos.map((p, i) =>
    `<span class="${i < state.picks.length ? 'done' : i === state.picks.length ? 'next' : ''}">${i + 1} ${esc(posName(p))}</span>`).join('');
}

function pick(i) {
  const sp = SPREADS[state.spread];
  if (state.picks.length >= sp.pos.length || state.picks.includes(i)) return;
  state.picks.push(i);
  $(`#fan button[data-i="${i}"]`).classList.add('taken');
  renderSlots();
  if (state.picks.length === sp.pos.length) {
    state.reading = state.picks.map(k => state.deck[k]);
    saveHistory();
    setTimeout(() => openReading(false), 600);
  }
}

$('#fan').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) pick(+b.dataset.i);
});

$('#pick-auto').addEventListener('click', () => {
  const need = SPREADS[state.spread].pos.length;
  const timer = setInterval(() => {
    if (state.picks.length >= need || !$('#v-pick').classList.contains('on')) return clearInterval(timer);
    let i;
    do { i = Math.floor(rand() * state.deck.length); } while (state.picks.includes(i));
    pick(i);
  }, 240);
});

$('#pick-back').addEventListener('click', () => show('v-intro'));

// ---------- 牌阵与解读 ----------

function layoutStage() {
  const sp = SPREADS[state.spread];
  const avail = $('.stage-wrap').clientWidth - 24;
  const cw = Math.max(48, Math.min(sp.max, Math.floor(avail / sp.w)));
  const stage = $('#stage');
  stage.style.setProperty('--cw', cw + 'px');
  stage.style.width = sp.w * cw + 'px';
  stage.style.height = sp.h * cw * 1.65 + 'px';
  stage.querySelectorAll('.slot').forEach(el => {
    const p = sp.pos[+el.dataset.i];
    el.style.left = p.x * cw + 'px';
    el.style.top = p.y * cw * 1.65 + 'px';
  });
}

function openReading(allFlipped) {
  const sp = SPREADS[state.spread];
  state.flipped = new Set(allFlipped ? sp.pos.map((_, i) => i) : []);
  $('#r-question').textContent = state.question ? `「${state.question}」` : '心中所问';
  $('#r-spread').textContent = `${sp.name} · ${sp.pos.length} 张`;

  $('#stage').innerHTML = state.reading.map(({ card, rev }, i) => {
    const p = sp.pos[i];
    const lit = state.flipped.has(i);
    return `<div class="slot${lit && card.major ? ' major' : ''}" data-i="${i}" style="animation-delay:${i * 0.12}s;z-index:${p.cross ? 2 : 1}">
      <div class="rot${p.cross ? ' cross' : ''}${lit ? ' flipped' : ''}" role="button" tabindex="0" aria-label="${i + 1} ${esc(posName(p))}">
        <span class="badge">${i + 1}</span>
        <div class="tilt"><div class="inner"><div class="back">${BACK_SVG}</div><div class="face${rev ? ' rev' : ''}">${faceSVG(card)}</div></div></div>
      </div></div>`;
  }).join('');

  $('#entries').innerHTML = sp.pos.map((p, i) => `<div class="panel entry pending" id="e-${i}"></div>`).join('');
  sp.pos.forEach((_, i) => renderEntry(i, false));
  $('#summary').classList.remove('on');
  show('v-reading');
  requestAnimationFrame(layoutStage);
  updateDone();
}

function renderEntry(i, animate) {
  const sp = SPREADS[state.spread];
  const p = sp.pos[i];
  const el = $('#e-' + i);
  const head = `<span class="pos">${String(i + 1).padStart(2, '0')} · <b>${esc(posName(p))}</b></span>`;
  if (!state.flipped.has(i)) {
    el.className = 'panel entry pending';
    el.innerHTML = `<div class="thumb">${BACK_SVG}</div><div><h3>${head}未揭晓</h3><div class="pd">${p.d}</div><p>点击上方的牌面翻开。</p></div>`;
    return;
  }
  const { card, rev } = state.reading[i];
  el.className = `panel entry${card.major ? ' major' : ''}${animate ? ' reveal' : ''}`;
  el.innerHTML = `<div class="thumb${rev ? ' rev' : ''}">${faceSVG(card)}</div>
    <div>
      <h3>${head}${card.name}<span class="tag${rev ? ' rev' : ''}">${rev ? '逆位' : '正位'}</span>${card.major ? '<span class="tag maj">大阿卡纳</span>' : ''}</h3>
      <div class="pd">${p.d}</div>
      <div class="kws">${(rev ? card.rev : card.up).map(k => `<span>${k}</span>`).join('')}</div>
      <p>${cardText(card, rev)}</p>
      <div class="extra">${cardExtra(card)}</div>
    </div>`;
}

function burst(slot, major) {
  if (STILL) return;
  const b = document.createElement('span');
  b.className = 'burst' + (major ? ' major' : '');
  const n = major ? 22 : 14;
  b.innerHTML = Array.from({ length: n }, (_, k) =>
    `<i style="--a:${(k * 360 / n + Math.random() * 12).toFixed(1)}deg;--d:calc(var(--cw) * ${(major ? 1.1 : .8) + Math.random() * .5})"></i>`).join('');
  slot.appendChild(b);
  setTimeout(() => b.remove(), 1300);
}

function flip(i) {
  const slot = $(`.slot[data-i="${i}"]`);
  const rot = slot.querySelector('.rot');
  if (state.flipped.has(i)) {
    const entry = $('#e-' + i);
    entry.scrollIntoView({ behavior: STILL ? 'auto' : 'smooth', block: 'center' });
    for (const el of [entry, rot]) {
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1200);
    }
    return;
  }
  const { card } = state.reading[i];
  state.flipped.add(i);
  rot.classList.add('flipped');
  setTimeout(() => {
    burst(slot, card.major);
    rot.classList.add('shine');
    setTimeout(() => rot.classList.remove('shine'), 1500);
    if (card.major) {
      slot.classList.add('major');
      if (!STILL) {
        const call = document.createElement('span');
        call.className = 'arcana-call';
        call.textContent = `ARCANUM ${ROMAN[card.num]}`;
        slot.appendChild(call);
        setTimeout(() => call.remove(), 2300);
      }
    }
  }, STILL ? 0 : 380);
  renderEntry(i, true);
  updateDone();
}

function updateDone() {
  const n = SPREADS[state.spread].pos.length;
  const done = state.flipped.size === n;
  $('#flip-all').hidden = done;
  if (done && !$('#summary').classList.contains('on')) {
    $('#summary').innerHTML = `<h2>整体来看</h2>${n > 1 ? energyHTML(state.reading) : ''}<ul>${summarize(state.reading).map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
    $('#summary').classList.add('on');
  }
}

const stageEl = $('#stage');
stageEl.addEventListener('click', e => {
  const slot = e.target.closest('.slot');
  if (slot) flip(+slot.dataset.i);
});
stageEl.addEventListener('keydown', e => {
  const slot = e.target.closest('.slot');
  if (slot && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); flip(+slot.dataset.i); }
});

// 鼠标悬停时，翻开的牌跟着倾斜，并有镭射反光
let tilted = null;
function untilt() {
  if (!tilted) return;
  tilted.classList.remove('hover');
  tilted.style.removeProperty('--rx');
  tilted.style.removeProperty('--ry');
  tilted = null;
}
stageEl.addEventListener('pointermove', e => {
  const rot = e.pointerType === 'mouse' ? e.target.closest('.rot.flipped') : null;
  if (rot !== tilted) untilt();
  if (!rot || STILL) return;
  const r = rot.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  const sign = rot.classList.contains('cross') ? -1 : 1;
  rot.style.setProperty('--ry', ((px - .5) * 22 * sign).toFixed(1) + 'deg');
  rot.style.setProperty('--rx', ((.5 - py) * 22).toFixed(1) + 'deg');
  rot.style.setProperty('--mx', (px * 100).toFixed(0) + '%');
  rot.style.setProperty('--my', (py * 100).toFixed(0) + '%');
  rot.style.setProperty('--sx', (px * 100).toFixed(0) + '%');
  rot.style.setProperty('--sy', (py * 100).toFixed(0) + '%');
  rot.classList.add('hover');
  tilted = rot;
});
stageEl.addEventListener('pointerleave', untilt);

$('#flip-all').addEventListener('click', () => {
  let k = 0;
  SPREADS[state.spread].pos.forEach((_, i) => {
    if (!state.flipped.has(i)) setTimeout(() => flip(i), k++ * 260);
  });
});

$('#again').addEventListener('click', () => { renderSpreads(); renderHistory(); show('v-intro'); });

$('#copy').addEventListener('click', async () => {
  const sp = SPREADS[state.spread];
  const lines = [`星夜塔罗 · ${sp.name}`, state.question ? `问题：${state.question}` : '', ''];
  state.reading.forEach(({ card, rev }, i) => {
    lines.push(`${i + 1}. ${posName(sp.pos[i])}：${card.name}（${rev ? '逆位' : '正位'}）— ${(rev ? card.rev : card.up).join('、')}`);
    lines.push(`   ${cardText(card, rev)}`);
  });
  lines.push('', '整体来看：', ...summarize(state.reading).map(s => '· ' + s));
  const btn = $('#copy');
  try {
    await navigator.clipboard.writeText(lines.filter((l, i) => l || i > 1).join('\n'));
    btn.textContent = '已复制';
  } catch {
    btn.textContent = '复制失败';
  }
  setTimeout(() => { btn.textContent = '复制结果'; }, 1500);
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if ($('#v-reading').classList.contains('on')) layoutStage();
    if ($('#v-pick').classList.contains('on')) layoutFan();
  }, 100);
});

// ---------- 记录 ----------

const HKEY = 'starry-tarot-history';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch { return []; }
}

function saveHistory() {
  const list = loadHistory();
  list.unshift({
    t: Date.now(), q: state.question, s: state.spread, l: state.labels,
    c: state.reading.map(r => [r.card.id, r.rev ? 1 : 0]),
  });
  try { localStorage.setItem(HKEY, JSON.stringify(list.slice(0, 30))); } catch { /* 无痕模式等情况下不保存 */ }
}

let historyItems = [];
function renderHistory() {
  historyItems = loadHistory().filter(h => SPREADS[h.s] && h.c.length === SPREADS[h.s].pos.length);
  $('#history').hidden = !historyItems.length;
  $('#hist-list').innerHTML = historyItems.map((h, i) => {
    const d = new Date(h.t);
    const when = `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    const names = h.c.map(([id, r]) => DECK[id].name + (r ? '(逆)' : '')).join('、');
    return `<li><button data-h="${i}"><div class="q">${esc(h.q || '心中所问')}</div><div class="meta">${when} · ${SPREADS[h.s].name} · ${names}</div></button></li>`;
  }).join('');
}

$('#hist-list').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const h = historyItems[+b.dataset.h];
  state.question = h.q;
  state.spread = h.s;
  state.labels = h.l || { A: '选择 A', B: '选择 B' };
  state.reading = h.c.map(([id, r]) => ({ card: DECK[id], rev: !!r }));
  openReading(true);
});

$('#hist-clear').addEventListener('click', () => {
  try { localStorage.removeItem(HKEY); } catch { /* 忽略 */ }
  renderHistory();
});

renderSpreads();
renderHistory();
</script>
