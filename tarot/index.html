<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星夜塔罗</title>
<style>
:root {
  --bg: #0d0b1a;
  --bg2: #17132b;
  --panel: rgba(30, 25, 56, .72);
  --ink: #efe6d2;
  --muted: #a69cba;
  --gold: #d9b46a;
  --gold2: #f3d998;
  --line: rgba(217, 180, 106, .28);
  --rev: #e08a8a;
  --cw: 110px;
  --serif: "Songti SC", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", serif;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font: 16px/1.7 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 9%, #fff6 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 33% 72%, #fff5 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 64%, #fff7 50%, transparent 51%),
    radial-gradient(1px 1px at 56% 38%, #fff4 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 6% 88%, #fff5 50%, transparent 51%),
    radial-gradient(ellipse at 50% -10%, #3a2a6b 0%, transparent 60%),
    linear-gradient(var(--bg2), var(--bg));
  background-attachment: fixed;
}
button, input, textarea { font: inherit; color: inherit; }
header { text-align: center; padding: 36px 16px 8px; }
header h1 { font-family: var(--serif); font-weight: 600; font-size: 34px; letter-spacing: .3em; margin: 0; color: var(--gold2); text-shadow: 0 0 18px rgba(243, 217, 152, .35); }
header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .1em; }
main { max-width: 980px; margin: 0 auto; padding: 16px 16px 48px; }
.view { display: none; }
.view.on { display: block; animation: fade .5s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; backdrop-filter: blur(4px); }
h2 { font-family: var(--serif); font-weight: 600; color: var(--gold2); font-size: 20px; margin: 0 0 12px; letter-spacing: .08em; }
label.field { display: block; margin-bottom: 18px; }
label.field span { display: block; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
textarea, input[type=text] {
  width: 100%; background: rgba(10, 8, 22, .6); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; outline: none; resize: vertical;
}
textarea:focus, input[type=text]:focus { border-color: var(--gold); }

.spreads { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 18px; }
.spread {
  text-align: left; background: rgba(10, 8, 22, .45); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; cursor: pointer; transition: border-color .2s, background .2s;
}
.spread b { display: block; font-family: var(--serif); color: var(--gold2); font-weight: 600; }
.spread small { color: var(--muted); font-size: 13px; line-height: 1.5; display: block; margin-top: 2px; }
.spread em { font-style: normal; color: var(--gold); font-size: 12px; float: right; }
.spread:hover { border-color: var(--gold); }
.spread[aria-pressed=true] { border-color: var(--gold2); background: rgba(217, 180, 106, .12); box-shadow: 0 0 0 1px var(--gold2) inset; }
.choice-names { display: none; gap: 10px; margin-bottom: 18px; }
.choice-names.on { display: grid; grid-template-columns: 1fr 1fr; }
.choice-names label span { display: block; color: var(--muted); font-size: 14px; margin-bottom: 6px; }

.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; cursor: pointer; }
.toggle input { accent-color: var(--gold); width: 16px; height: 16px; }
.btn {
  border: 1px solid var(--gold); background: linear-gradient(#e4c07a, #b88f45); color: #21180a;
  font-weight: 600; letter-spacing: .15em; padding: 10px 22px; border-radius: 999px; cursor: pointer;
  box-shadow: 0 4px 18px rgba(217, 180, 106, .25); transition: transform .15s, box-shadow .15s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(217, 180, 106, .4); }
.btn.ghost { background: transparent; color: var(--gold2); box-shadow: none; letter-spacing: .08em; }
.btn.ghost:hover { background: rgba(217, 180, 106, .1); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.spacer { flex: 1; }

details.history { margin-top: 18px; }
details.history summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.hist-list { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.hist-list button {
  width: 100%; text-align: left; background: rgba(10, 8, 22, .45); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 14px;
}
.hist-list button:hover { border-color: var(--gold); }
.hist-list .meta { color: var(--muted); font-size: 12px; }
.hist-clear { margin-top: 8px; background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; }

/* 洗牌 */
.shuffle { height: 300px; display: grid; place-items: center; position: relative; }
.shuffle .mini { position: absolute; width: 110px; height: 181px; animation: riffle 1.1s ease-in-out infinite; }
.shuffle .mini svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5)); }
@keyframes riffle {
  0%, 100% { transform: translateX(0) rotate(0); }
  30% { transform: translateX(var(--dx)) rotate(var(--dr)); }
  60% { transform: translateX(calc(var(--dx) * -.4)) rotate(calc(var(--dr) * -.5)); }
}
.center-note { text-align: center; color: var(--muted); font-family: var(--serif); letter-spacing: .2em; }

/* 抽牌 */
.pick-head { text-align: center; margin-bottom: 14px; }
.pick-head h2 { margin-bottom: 4px; }
.pick-head p { margin: 0; color: var(--muted); font-size: 14px; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0 18px; }
.slots span { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.slots span.done { border-color: var(--gold); color: var(--gold2); background: rgba(217, 180, 106, .12); }
.slots span.next { border-color: var(--gold2); color: var(--ink); }
.deck { display: flex; flex-wrap: wrap; justify-content: center; padding: 10px 0 10px 28px; row-gap: 10px; }
.deck button {
  width: 46px; height: 76px; margin-left: -28px; padding: 0; border: none; background: none; cursor: pointer;
  transition: transform .18s ease, opacity .3s ease; border-radius: 4px;
}
.deck button svg { width: 100%; height: 100%; display: block; filter: drop-shadow(-2px 2px 3px rgba(0, 0, 0, .55)); }
.deck button:hover, .deck button:focus-visible { transform: translateY(-12px); outline: none; z-index: 1; }
.deck button.taken { opacity: 0; pointer-events: none; transform: translateY(-40px); }
.pick-foot { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }

/* 牌阵 */
.reading-head { text-align: center; margin-bottom: 8px; }
.reading-head .q { font-family: var(--serif); font-size: 18px; color: var(--ink); }
.reading-head .s { color: var(--muted); font-size: 13px; letter-spacing: .1em; }
.stage-wrap { padding: 28px 0 16px; overflow: hidden; }
.stage { position: relative; margin: 0 auto; }
.slot { position: absolute; width: var(--cw); height: calc(var(--cw) * 1.65); pointer-events: none; animation: deal .6s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes deal { from { opacity: 0; transform: translateY(-50px) scale(.9); } }
.rot { position: absolute; inset: 0; perspective: 900px; cursor: pointer; pointer-events: auto; }
.rot.cross { transform: rotate(90deg); }
.inner { position: absolute; inset: 0; transition: transform .8s cubic-bezier(.3, .7, .2, 1); transform-style: preserve-3d; }
.flipped .inner { transform: rotateY(180deg); }
.back, .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: calc(var(--cw) * .07); overflow: hidden; box-shadow: 0 8px 22px rgba(0, 0, 0, .55);
}
.back svg, .face svg { width: 100%; height: 100%; display: block; }
.face { transform: rotateY(180deg); }
.face.rev svg { transform: rotate(180deg); }
.rot:not(.flipped):hover .back { box-shadow: 0 0 0 2px var(--gold2), 0 0 24px rgba(243, 217, 152, .45); }
.rot.flash .face { box-shadow: 0 0 0 2px var(--gold2), 0 0 30px rgba(243, 217, 152, .6); }
.badge {
  position: absolute; top: -10px; left: -10px; z-index: 2; width: 22px; height: 22px; border-radius: 50%;
  background: var(--bg2); border: 1px solid var(--gold); color: var(--gold2); font-size: 12px; line-height: 20px; text-align: center;
}
.rot.cross .badge { top: auto; bottom: -10px; }
.stage-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }

.entries { display: grid; gap: 12px; }
.entry { display: grid; grid-template-columns: 74px 1fr; gap: 16px; align-items: start; transition: box-shadow .3s; }
.entry.flash { box-shadow: 0 0 0 1px var(--gold2), 0 0 24px rgba(243, 217, 152, .25); }
.entry .thumb { width: 74px; height: 122px; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 12px rgba(0, 0, 0, .5); }
.entry .thumb svg { width: 100%; height: 100%; display: block; }
.entry .thumb.rev svg { transform: rotate(180deg); }
.entry.pending { opacity: .55; }
.entry h3 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 17px; color: var(--gold2); }
.entry h3 .pos { color: var(--muted); font-weight: 400; font-size: 14px; margin-right: 6px; }
.tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; border: 1px solid var(--gold); color: var(--gold2); font-family: system-ui, sans-serif; }
.tag.rev { border-color: var(--rev); color: var(--rev); }
.entry .pd { color: var(--muted); font-size: 13px; margin: 2px 0 6px; }
.kws { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.kws span { font-size: 12px; background: rgba(217, 180, 106, .12); color: var(--gold2); border-radius: 6px; padding: 1px 8px; }
.entry p { margin: 0; }
.entry .extra { color: var(--muted); font-size: 13px; margin-top: 4px; }

.summary { margin-top: 16px; display: none; }
.summary.on { display: block; animation: fade .6s ease; }
.summary ul { margin: 0; padding-left: 1.2em; }
.summary li { margin: 4px 0; }
.note { color: var(--muted); font-size: 12px; text-align: center; margin-top: 28px; }

@media (max-width: 560px) {
  header h1 { font-size: 28px; }
  .panel { padding: 16px; }
  .entry { grid-template-columns: 56px 1fr; gap: 12px; }
  .entry .thumb { width: 56px; height: 92px; }
  .choice-names.on { grid-template-columns: 1fr; }
  .deck button { width: 40px; height: 66px; margin-left: -24px; }
  .deck { padding-left: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<header>
  <h1>星夜塔罗</h1>
  <p>七十八张牌 · 静心提问 · 凭直觉抽取</p>
</header>
<main>
  <section class="view on" id="v-intro">
    <div class="panel">
      <label class="field">
        <span>心里默念你的问题（可以不写，但问得越具体，牌越好读）</span>
        <textarea id="question" rows="2" maxlength="200" placeholder="例如：接下来三个月，我该如何推进手上的项目？"></textarea>
      </label>
      <h2>选择牌阵</h2>
      <div class="spreads" id="spreads"></div>
      <div class="choice-names" id="choice-names">
        <label><span>选项 A 是什么？</span><input type="text" id="opt-a" maxlength="20" placeholder="比如：留在现在的公司"></label>
        <label><span>选项 B 是什么？</span><input type="text" id="opt-b" maxlength="20" placeholder="比如：接下新的offer"></label>
      </div>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="allow-rev" checked> 包含逆位牌</label>
        <span class="spacer"></span>
        <button class="btn" id="go">洗牌</button>
      </div>
      <details class="history" id="history" hidden>
        <summary>最近的占卜</summary>
        <ul class="hist-list" id="hist-list"></ul>
        <button class="hist-clear" id="hist-clear">清空记录</button>
      </details>
    </div>
  </section>

  <section class="view" id="v-shuffle">
    <div class="shuffle" id="shuffle"></div>
    <p class="center-note">正在洗牌……想着你的问题</p>
  </section>

  <section class="view" id="v-pick">
    <div class="pick-head">
      <h2 id="pick-title"></h2>
      <p>不必多想，哪张牌吸引你就点哪张。</p>
    </div>
    <div class="slots" id="slots"></div>
    <div class="deck" id="deck"></div>
    <div class="pick-foot">
      <button class="btn ghost" id="pick-auto">替我随机抽</button>
      <button class="btn ghost" id="pick-back">返回</button>
    </div>
  </section>

  <section class="view" id="v-reading">
    <div class="reading-head">
      <div class="q" id="r-question"></div>
      <div class="s" id="r-spread"></div>
    </div>
    <div class="stage-wrap"><div class="stage" id="stage"></div></div>
    <div class="stage-actions">
      <button class="btn" id="flip-all">全部翻开</button>
      <button class="btn ghost" id="copy">复制结果</button>
      <button class="btn ghost" id="again">再占一次</button>
    </div>
    <div class="entries" id="entries"></div>
    <div class="panel summary" id="summary"></div>
  </section>

  <p class="note">塔罗是一面帮助自我反思的镜子，不能代替医疗、法律、财务等专业意见。</p>
</main>

function pipPositions(n) {
  const top = 34, span = 92, out = [];
  if (n <= 3) {
    for (let i = 0; i < n; i++) out.push([50, top + (i + 0.5) * span / n]);
    return out;
  }
  const rows = Math.floor(n / 2);
  for (let i = 0; i < rows; i++) {
    const y = top + (i + 0.5) * span / rows;
    out.push([31, y], [69, y]);
  }
  if (n % 2) out.push([50, top + span / 2]);
  return out;
}

function joinCn(list) {
  return list.length < 2 ? list.join('') : list.slice(0, -1).join('、') + '和' + list[list.length - 1];
}

const rankLabel = rank => rank.mark === 'A' ? '王牌' : '数字' + rank.name;

function cardText(card, rev) {
  if (card.major) return rev ? card.rmsg : card.msg;
  const kws = joinCn(rev ? card.rev : card.up);
  const tail = rev
    ? `逆位时，这股能量受阻、过了头或转向内在：${kws}。`
    : `正位时，它表现为${kws}。`;
  if (card.rank.court) return `${card.rank.line}在${card.suit.name}（${card.suit.theme}）里，${tail}`;
  return `${rankLabel(card.rank)}象征${card.rank.theme}；落在${card.suit.name}（${card.suit.theme}）上，${tail}`;
}

function cardExtra(card) {
  if (card.major) return `大阿卡纳 ${ROMAN[card.num]} · ${card.en} · 对应${card.astro}`;
  return `小阿卡纳 · ${card.suit.name} · ${card.suit.el}元素`;
}

function summarize(reading) {
  const n = reading.length;
  if (n === 1) {
    const { card, rev } = reading[0];
    return [`这张${card.name}${rev ? '（逆位）' : ''}就是今天的答案：${(rev ? card.rev : card.up).slice(0, 3).join('、')}。`];
  }
  const out = [];
  const majors = reading.filter(r => r.card.major).length;
  const revs = reading.filter(r => r.rev).length;
  const courts = reading.filter(r => !r.card.major && r.card.rank.court).length;

  if (majors === 0) out.push('全是小阿卡纳：问题落在日常层面，主动权大多握在你自己手里。');
  else if (majors / n >= 0.5) out.push(`大阿卡纳占了 ${majors} 张：这不只是日常琐事，牵动的是更深的人生课题，顺势而为比硬拗更重要。`);
  else out.push(`大阿卡纳有 ${majors} 张：大方向上有命运的推动，细节仍靠你自己把握。`);

  const counts = SUITS.map(s => reading.filter(r => !r.card.major && r.card.suit === s).length);
  const top = Math.max(...counts);
  if (top >= 2 && counts.filter(c => c === top).length === 1) out.push(SUITS[counts.indexOf(top)].most);
  const missing = SUITS.filter((s, i) => counts[i] === 0);
  if (n >= 5 && missing.length === 1) out.push(`唯独没有${missing[0].name}：${missing[0].theme}这一块，也许是被你忽略的地方。`);

  if (revs === 0) out.push('没有逆位：能量通畅，可以放手去做。');
  else if (revs / n > 0.5) out.push(`逆位有 ${revs} 张，偏多：能量有些堵塞或在向内收，先处理卡住的地方，再谈向前。`);

  if (courts >= 2) out.push(`宫廷牌有 ${courts} 张：别人的态度，或你在其中扮演的角色，是这件事的关键。`);

  const nums = {};
  reading.forEach(r => { if (!r.card.major && !r.card.rank.court) nums[r.card.num] = (nums[r.card.num] || 0) + 1; });
  Object.entries(nums).filter(([, c]) => c >= 2).forEach(([num, c]) => {
    out.push(`出现了 ${c} 张「${RANKS[num - 1].name}」：${rankLabel(RANKS[num - 1])}象征${RANKS[num - 1].theme}，这个主题在这次占卜里被强调了。`);
  });

  const last = reading[n - 1];
  if (state.spread === 'choice') {
    const a = reading[2], b = reading[4];
    const score = r => (r.rev ? -1 : 1) + (r.card.major ? 0.5 : 0);
    const sa = score(a) + score(reading[1]), sb = score(b) + score(reading[3]);
    if (sa !== sb) {
      const better = sa > sb ? state.labels.A : state.labels.B;
      out.push(`两条路相比，「${better}」那一边的牌更顺畅；但最终的选择，仍要回到「现状」那张牌提醒你的东西上。`);
    } else {
      out.push('两条路的牌势不相上下：重要的不是哪条路更好，而是你更愿意承担哪一种过程。');
    }
  } else {
    out.push(`最后一张「${last.card.name}${last.rev ? '（逆位）' : ''}」是走向：${last.rev ? last.card.rev[0] : last.card.up[0]}。`);
  }
  return out;
}

// ---------- 状态 ----------

const state = { question: '', spread: 'three', labels: { A: '选择 A', B: '选择 B' }, allowRev: true, deck: [], picks: [], reading: [], flipped: new Set() };

function rand() {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0] / 4294967296;
}

function shuffled() {
  const d = DECK.map(card => ({ card, rev: state.allowRev && rand() < 0.5 }));
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}

const posName = p => p.n.replace('{A}', state.labels.A).replace('{B}', state.labels.B);

function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---------- 首页 ----------

const $ = s => document.querySelector(s);

function renderSpreads() {
  $('#spreads').innerHTML = Object.entries(SPREADS).map(([k, s]) =>
    `<button class="spread" data-k="${k}" aria-pressed="${k === state.spread}"><em>${s.count}</em><b>${s.name}</b><small>${s.desc}</small></button>`).join('');
  $('#choice-names').classList.toggle('on', state.spread === 'choice');
}

$('#spreads').addEventListener('click', e => {
  const b = e.target.closest('.spread');
  if (!b) return;
  state.spread = b.dataset.k;
  renderSpreads();
});

$('#go').addEventListener('click', () => {
  state.question = $('#question').value.trim();
  state.allowRev = $('#allow-rev').checked;
  state.labels = {
    A: $('#opt-a').value.trim() || '选择 A',
    B: $('#opt-b').value.trim() || '选择 B',
  };
  state.deck = shuffled();
  state.picks = [];
  runShuffle();
});

function runShuffle() {
  const box = $('#shuffle');
  box.innerHTML = Array.from({ length: 7 }, (_, i) => {
    const dx = (i % 2 ? 1 : -1) * (30 + i * 9), dr = (i % 2 ? 1 : -1) * (4 + i);
    return `<div class="mini" style="--dx:${dx}px;--dr:${dr}deg;animation-delay:${i * 0.08}s">${BACK_SVG}</div>`;
  }).join('');
  show('v-shuffle');
  setTimeout(renderPick, 1900);
}

// ---------- 抽牌 ----------

function renderPick() {
  const sp = SPREADS[state.spread];
  $('#pick-title').textContent = `请抽 ${sp.pos.length} 张牌`;
  $('#deck').innerHTML = state.deck.map((_, i) => `<button data-i="${i}" aria-label="第 ${i + 1} 张牌">${BACK_SVG}</button>`).join('');
  renderSlots();
  show('v-pick');
}

function renderSlots() {
  const sp = SPREADS[state.spread];
  $('#slots').innerHTML = sp.pos.map((p, i) =>
    `<span class="${i < state.picks.length ? 'done' : i === state.picks.length ? 'next' : ''}">${i + 1} ${esc(posName(p))}</span>`).join('');
}

function pick(i) {
  const sp = SPREADS[state.spread];
  if (state.picks.length >= sp.pos.length || state.picks.includes(i)) return;
  state.picks.push(i);
  $(`#deck button[data-i="${i}"]`).classList.add('taken');
  renderSlots();
  if (state.picks.length === sp.pos.length) {
    state.reading = state.picks.map(k => state.deck[k]);
    saveHistory();
    setTimeout(() => openReading(false), 450);
  }
}

$('#deck').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) pick(+b.dataset.i);
});

$('#pick-auto').addEventListener('click', () => {
  const need = SPREADS[state.spread].pos.length;
  const timer = setInterval(() => {
    if (state.picks.length >= need || !$('#v-pick').classList.contains('on')) return clearInterval(timer);
    let i;
    do { i = Math.floor(rand() * state.deck.length); } while (state.picks.includes(i));
    pick(i);
  }, 220);
});

$('#pick-back').addEventListener('click', () => show('v-intro'));

// ---------- 牌阵与解读 ----------

function layoutStage() {
  const sp = SPREADS[state.spread];
  const avail = $('.stage-wrap').clientWidth - 24;
  const cw = Math.max(48, Math.min(sp.max, Math.floor(avail / sp.w)));
  const stage = $('#stage');
  stage.style.setProperty('--cw', cw + 'px');
  stage.style.width = sp.w * cw + 'px';
  stage.style.height = sp.h * cw * 1.65 + 'px';
  stage.querySelectorAll('.slot').forEach(el => {
    const p = sp.pos[+el.dataset.i];
    el.style.left = p.x * cw + 'px';
    el.style.top = p.y * cw * 1.65 + 'px';
  });
}

function openReading(allFlipped) {
  const sp = SPREADS[state.spread];
  state.flipped = new Set(allFlipped ? sp.pos.map((_, i) => i) : []);
  $('#r-question').textContent = state.question ? `「${state.question}」` : '心中所问';
  $('#r-spread').textContent = `${sp.name} · ${sp.pos.length} 张`;

  $('#stage').innerHTML = state.reading.map(({ card, rev }, i) => {
    const p = sp.pos[i];
    return `<div class="slot" data-i="${i}" style="animation-delay:${i * 0.09}s;z-index:${p.cross ? 2 : 1}">
      <div class="rot${p.cross ? ' cross' : ''}${state.flipped.has(i) ? ' flipped' : ''}" role="button" tabindex="0" aria-label="${i + 1} ${esc(posName(p))}">
        <span class="badge">${i + 1}</span>
        <div class="inner"><div class="back">${BACK_SVG}</div><div class="face${rev ? ' rev' : ''}">${faceSVG(card)}</div></div>
      </div></div>`;
  }).join('');

  $('#entries').innerHTML = sp.pos.map((p, i) => `<div class="panel entry pending" id="e-${i}"></div>`).join('');
  sp.pos.forEach((_, i) => renderEntry(i));
  $('#summary').classList.remove('on');
  show('v-reading');
  requestAnimationFrame(layoutStage);
  updateDone();
}

function renderEntry(i) {
  const sp = SPREADS[state.spread];
  const p = sp.pos[i];
  const el = $('#e-' + i);
  if (!state.flipped.has(i)) {
    el.className = 'panel entry pending';
    el.innerHTML = `<div class="thumb">${BACK_SVG}</div><div><h3><span class="pos">${i + 1} · ${esc(posName(p))}</span></h3><div class="pd">${p.d}</div><p>点击牌面翻开。</p></div>`;
    return;
  }
  const { card, rev } = state.reading[i];
  el.className = 'panel entry';
  el.innerHTML = `<div class="thumb${rev ? ' rev' : ''}">${faceSVG(card)}</div>
    <div>
      <h3><span class="pos">${i + 1} · ${esc(posName(p))}</span>${card.name}<span class="tag${rev ? ' rev' : ''}">${rev ? '逆位' : '正位'}</span></h3>
      <div class="pd">${p.d}</div>
      <div class="kws">${(rev ? card.rev : card.up).map(k => `<span>${k}</span>`).join('')}</div>
      <p>${cardText(card, rev)}</p>
      <div class="extra">${cardExtra(card)}</div>
    </div>`;
}

function flip(i) {
  const rot = $(`.slot[data-i="${i}"] .rot`);
  if (state.flipped.has(i)) {
    const entry = $('#e-' + i);
    entry.scrollIntoView({ behavior: 'smooth', block: 'center' });
    for (const el of [entry, rot]) {
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1200);
    }
    return;
  }
  state.flipped.add(i);
  rot.classList.add('flipped');
  renderEntry(i);
  updateDone();
}

function updateDone() {
  const n = SPREADS[state.spread].pos.length;
  const done = state.flipped.size === n;
  $('#flip-all').hidden = done;
  if (done && !$('#summary').classList.contains('on')) {
    $('#summary').innerHTML = `<h2>整体来看</h2><ul>${summarize(state.reading).map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
    $('#summary').classList.add('on');
  }
}

$('#stage').addEventListener('click', e => {
  const slot = e.target.closest('.slot');
  if (slot) flip(+slot.dataset.i);
});
$('#stage').addEventListener('keydown', e => {
  const slot = e.target.closest('.slot');
  if (slot && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); flip(+slot.dataset.i); }
});

$('#flip-all').addEventListener('click', () => {
  SPREADS[state.spread].pos.forEach((_, i) => {
    if (!state.flipped.has(i)) setTimeout(() => flip(i), i * 160);
  });
});

$('#again').addEventListener('click', () => { renderSpreads(); renderHistory(); show('v-intro'); });

$('#copy').addEventListener('click', async () => {
  const sp = SPREADS[state.spread];
  const lines = [`星夜塔罗 · ${sp.name}`, state.question ? `问题：${state.question}` : '', ''];
  state.reading.forEach(({ card, rev }, i) => {
    lines.push(`${i + 1}. ${posName(sp.pos[i])}：${card.name}（${rev ? '逆位' : '正位'}）— ${(rev ? card.rev : card.up).join('、')}`);
    lines.push(`   ${cardText(card, rev)}`);
  });
  lines.push('', '整体来看：', ...summarize(state.reading).map(s => '· ' + s));
  const btn = $('#copy');
  try {
    await navigator.clipboard.writeText(lines.filter((l, i) => l || i > 1).join('\n'));
    btn.textContent = '已复制';
  } catch {
    btn.textContent = '复制失败';
  }
  setTimeout(() => { btn.textContent = '复制结果'; }, 1500);
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if ($('#v-reading').classList.contains('on')) layoutStage(); }, 100);
});

// ---------- 记录 ----------

const HKEY = 'starry-tarot-history';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch { return []; }
}

function saveHistory() {
  const list = loadHistory();
  list.unshift({
    t: Date.now(), q: state.question, s: state.spread, l: state.labels,
    c: state.reading.map(r => [r.card.id, r.rev ? 1 : 0]),
  });
  try { localStorage.setItem(HKEY, JSON.stringify(list.slice(0, 30))); } catch { /* 无痕模式等情况下不保存 */ }
}

function renderHistory() {
  const list = loadHistory().filter(h => SPREADS[h.s] && h.c.length === SPREADS[h.s].pos.length);
  $('#history').hidden = !list.length;
  $('#hist-list').innerHTML = list.map((h, i) => {
    const d = new Date(h.t);
    const when = `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    const names = h.c.map(([id, r]) => DECK[id].name + (r ? '(逆)' : '')).join('、');
    return `<li><button data-h="${i}"><div>${esc(h.q || '心中所问')}</div><div class="meta">${when} · ${SPREADS[h.s].name} · ${names}</div></button></li>`;
  }).join('');
  $('#hist-list').dataset.items = JSON.stringify(list);
}

$('#hist-list').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const h = JSON.parse($('#hist-list').dataset.items)[+b.dataset.h];
  state.question = h.q;
  state.spread = h.s;
  state.labels = h.l || { A: '选择 A', B: '选择 B' };
  state.reading = h.c.map(([id, r]) => ({ card: DECK[id], rev: !!r }));
  openReading(true);
});

$('#hist-clear').addEventListener('click', () => {
  try { localStorage.removeItem(HKEY); } catch { /* 忽略 */ }
  renderHistory();
});

renderSpreads();
renderHistory();
</script>
